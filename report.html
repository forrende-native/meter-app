<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายละเอียดรายห้อง — มิเตอร์น้ำ-ไฟ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f2f5;
    --card-bg: #ffffff;
    --border: #e1e4e8;
    --text: #1a1a1a;
    --text-muted: #6b7280;
    --head-bg: #f7f8fa;
    --row-hover: #f5f7fa;
    --accent: #1565c0;
    --focus-ring: #1565c0;
    --warning: #c62828;
    --bar: #c7d7ef;
    --input-bg: #fafafa;
    --input-border: #ccc;
    --btn-bg: #eef1f5;
    --btn-active-bg: #1565c0;
    --btn-active-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181c;
      --card-bg: #1e2227;
      --border: #30353c;
      --text: #e8e9eb;
      --text-muted: #9aa0a8;
      --head-bg: #262b31;
      --row-hover: #262b31;
      --accent: #5b9bf0;
      --focus-ring: #5b9bf0;
      --warning: #ef6b6b;
      --bar: #2e3c57;
      --input-bg: #262b31;
      --input-border: #3a4149;
      --btn-bg: #262b31;
      --btn-active-bg: #5b9bf0;
      --btn-active-text: #10141a;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    background: var(--bg);
    color: var(--text);
  }
  body {
    font-family: "IBM Plex Sans Thai", "Noto Sans Thai", -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 20px 14px 40px;
  }
  .card {
    max-width: 1400px;
    margin: 0 auto;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .back-link {
    display: inline-block;
    margin-bottom: 10px;
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
  }
  .back-link:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }
  .eyebrow {
    margin: 0 0 4px;
    font-size: 13px;
    color: var(--text-muted);
  }
  h1 {
    margin: 0 0 16px;
    font-size: 22px;
    font-weight: 700;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }
  #searchInput {
    flex: 1 1 220px;
    min-width: 160px;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    border: 1px solid var(--input-border);
    border-radius: 8px;
    background: var(--input-bg);
    color: var(--text);
  }
  #searchInput:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 1px;
  }
  .building-filter {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
    border: 1px solid var(--input-border);
    border-radius: 8px;
    background: var(--btn-bg);
    color: var(--text);
    cursor: pointer;
  }
  .filter-btn.active {
    background: var(--btn-active-bg);
    color: var(--btn-active-text);
    border-color: var(--btn-active-bg);
  }
  .filter-btn:focus-visible,
  .filter-btn:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }
  .header-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .menu-wrap {
    position: relative;
    flex-shrink: 0;
  }
  .menu-btn {
    width: 36px;
    height: 36px;
    font-size: 20px;
    line-height: 1;
    border: 1px solid var(--input-border);
    border-radius: 8px;
    background: var(--btn-bg);
    color: var(--text);
    cursor: pointer;
  }
  .menu-btn:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }
  .menu-dropdown {
    display: none;
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    min-width: 200px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    overflow: hidden;
    z-index: 20;
  }
  .menu-dropdown.open { display: block; }
  .menu-dropdown button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    border: none;
    background: none;
    color: var(--text);
    cursor: pointer;
  }
  .menu-dropdown button:hover,
  .menu-dropdown button:focus-visible {
    background: var(--row-hover);
    outline: none;
  }
  .status {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 10px;
    min-height: 18px;
  }
  .status.error { color: var(--warning); }
  .table-wrap {
    max-height: 30rem;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 920px;
    font-size: 13px;
  }
  thead th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--head-bg);
    text-align: left;
    padding: 9px 9px;
    font-weight: 600;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  thead th:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: -2px;
  }
  thead th .arrow {
    display: inline-block;
    width: 1em;
    opacity: 0.6;
    font-size: 11px;
  }
  td {
    padding: 7px 9px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr:last-child td { border-bottom: none; }
  td.num, th.num {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  td.warning { color: var(--warning); font-weight: 600; }
  .total-cell {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }
  .total-bar-track {
    width: 56px;
    height: 6px;
    border-radius: 3px;
    background: var(--border);
    overflow: hidden;
    flex-shrink: 0;
  }
  .total-bar-fill {
    height: 100%;
    background: var(--bar);
    border-radius: 3px;
  }
  .empty-row td {
    text-align: center;
    color: var(--text-muted);
    padding: 24px 12px;
    white-space: normal;
  }
  .preview-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 50;
    padding: 20px;
    overflow: auto;
  }
  .preview-overlay.open { display: flex; justify-content: center; align-items: flex-start; }
  .preview-box {
    background: var(--card-bg);
    border-radius: 12px;
    max-width: 860px;
    width: 100%;
    padding: 20px;
    color: var(--text);
  }
  .preview-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    gap: 10px;
  }
  .preview-toolbar h2 {
    margin: 0;
    font-size: 17px;
  }
  .preview-actions { display: flex; gap: 8px; }
  .preview-actions button {
    padding: 8px 14px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
    border: 1px solid var(--input-border);
    border-radius: 8px;
    background: var(--btn-bg);
    color: var(--text);
    cursor: pointer;
  }
  .preview-actions .primary {
    background: var(--btn-active-bg);
    color: var(--btn-active-text);
    border-color: var(--btn-active-bg);
  }
  #previewContent {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    max-height: 70vh;
    overflow: auto;
  }
  #previewContent table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 0;
  }
  #previewContent th, #previewContent td {
    border: 1px solid #ccc;
    padding: 6px 8px;
    white-space: nowrap;
  }
  #previewContent th.num, #previewContent td.num { text-align: right; font-variant-numeric: tabular-nums; }
  #previewContent h3 { margin: 0 0 10px; font-size: 16px; }
  @media print {
    body * { visibility: hidden; }
    #previewContent, #previewContent * { visibility: visible; }
    #previewContent {
      position: absolute;
      left: 0; top: 0; width: 100%;
      border: none; max-height: none; overflow: visible;
    }
  }
</style>
</head>
<body>
<div class="card">
  <a href="index.html" class="back-link">&larr; กลับหน้าแรก</a>
  <p class="eyebrow" id="eyebrow">มิเตอร์น้ำ-ไฟ</p>
  <div class="header-row">
    <h1 id="h1Text">รายละเอียดรายห้อง</h1>
    <div class="menu-wrap">
      <button type="button" class="menu-btn" id="menuBtn" aria-label="เมนูส่งออก" aria-haspopup="true" aria-expanded="false">&#9776;</button>
      <div class="menu-dropdown" id="menuDropdown" role="menu">
        <button type="button" data-action="preview-print" role="menuitem">ดูตัวอย่างก่อนพิมพ์ / PDF</button>
        <button type="button" data-action="excel" role="menuitem">ส่งออก Excel (.xlsx)</button>
        <button type="button" data-action="word" role="menuitem">ส่งออก Word (.doc)</button>
      </div>
    </div>
  </div>
  <div class="controls">
    <input type="search" id="searchInput" placeholder="ค้นหาห้อง เช่น 305" aria-label="ค้นหาห้อง">
    <div class="building-filter" role="group" aria-label="กรองตึก" id="buildingFilter">
      <button type="button" class="filter-btn active" data-building="all">ทั้งหมด</button>
    </div>
    <button type="button" class="filter-btn" id="refreshBtn" aria-label="รีเฟรชข้อมูล">↻ รีเฟรช</button>
  </div>
  <div class="status" id="statusMsg">กำลังโหลดข้อมูล...</div>
  <div class="table-wrap">
    <table id="reportTable">
      <thead>
        <tr>
          <th data-key="building" data-type="text" tabindex="0" aria-sort="ascending">ตึก<span class="arrow">▲</span></th>
          <th data-key="room" data-type="natural" tabindex="0">ห้อง<span class="arrow"></span></th>
          <th class="num" data-key="waterPrev" data-type="number" tabindex="0">น้ำครั้งก่อน<span class="arrow"></span></th>
          <th class="num" data-key="waterCurr" data-type="number" tabindex="0">น้ำครั้งนี้<span class="arrow"></span></th>
          <th class="num" data-key="waterUnits" data-type="number" tabindex="0">น้ำ (หน่วย)<span class="arrow"></span></th>
          <th class="num" data-key="waterCost" data-type="number" tabindex="0">ค่าน้ำ (บาท)<span class="arrow"></span></th>
          <th class="num" data-key="elecPrev" data-type="number" tabindex="0">ไฟครั้งก่อน<span class="arrow"></span></th>
          <th class="num" data-key="elecCurr" data-type="number" tabindex="0">ไฟครั้งนี้<span class="arrow"></span></th>
          <th class="num" data-key="elecUnits" data-type="number" tabindex="0">ไฟ (หน่วย)<span class="arrow"></span></th>
          <th class="num" data-key="elecCost" data-type="number" tabindex="0">ค่าไฟ (บาท)<span class="arrow"></span></th>
          <th class="num" data-key="total" data-type="number" tabindex="0">รวม (บาท)<span class="arrow"></span></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="preview-overlay" id="previewOverlay">
  <div class="preview-box">
    <div class="preview-toolbar">
      <h2>ตัวอย่างก่อนพิมพ์</h2>
      <div class="preview-actions">
        <button type="button" id="previewCloseBtn">ปิด</button>
        <button type="button" class="primary" id="previewPrintBtn">พิมพ์ / บันทึก PDF</button>
      </div>
    </div>
    <div id="previewContent"></div>
  </div>
</div>

<script>
// ===== ตั้งค่า =====
// URL Apps Script Web App เดียวกับที่ sync.js ใช้ (รองรับ GET ?action=export)
const SHEET_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyCBp1Si7VkhekLIH2t1PAe4UpXelHzs3YTgyUdE555slItPnVg4igMiI-rckWd4H9_/exec';

// หน่วยไฟต่อเดือนที่ถือว่าสูงผิดปกติ — ตัวเลขนี้แก้ได้ง่ายที่เดียว
const ELECTRIC_WARNING_UNITS = 150;

const THAI_MONTHS = ['', 'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
  'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];

const numFmt = new Intl.NumberFormat('th-TH', { maximumFractionDigits: 0 });

let fullRows = [];       // ข้อมูลหลังรวม pivot ทั้งหมด (ยังไม่กรอง)
let currentBuilding = 'all';
let sortKey = 'building';
let sortDir = 'asc';
let maxTotal = 0;

// ลำดับตึกที่ต้องการให้เรียงเป็นค่าเริ่มต้นเสมอ — แก้ลำดับ/เพิ่มตึกใหม่ได้ที่นี่ที่เดียว
// ตึกที่ไม่อยู่ในลิสต์นี้ (เช่นเพิ่มเข้ามาใหม่แล้วยังไม่ได้แก้ตรงนี้) จะถูกเรียงไปต่อท้ายสุด
const BUILDING_ORDER = ['เพิ่มทรัพย์', 'ปานมณี', 'บ้านเช่า'];

function buildingSortIndex(building) {
  const idx = BUILDING_ORDER.indexOf(building);
  return idx === -1 ? BUILDING_ORDER.length : idx;
}

function naturalCompare(a, b) {
  const ax = String(a).match(/\d+|\D+/g) || [];
  const bx = String(b).match(/\d+|\D+/g) || [];
  const len = Math.max(ax.length, bx.length);
  for (let i = 0; i < len; i++) {
    const av = ax[i] || '';
    const bv = bx[i] || '';
    const an = parseInt(av, 10);
    const bn = parseInt(bv, 10);
    if (!isNaN(an) && !isNaN(bn)) {
      if (an !== bn) return an - bn;
    } else if (av !== bv) {
      return av.localeCompare(bv, 'th');
    }
  }
  return 0;
}

function setStatus(msg, isError) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.classList.toggle('error', !!isError);
}

async function loadData() {
  try {
    setStatus('กำลังโหลดข้อมูล...');
    // no-store กัน browser cache ข้อมูลเก่าค้าง (export endpoint ไม่มี cache-busting param ในตัวเอง)
    const resp = await fetch(SHEET_WEBAPP_URL + '?action=export', { cache: 'no-store' });
    const data = await resp.json();
    if (!data || !data.ok || !Array.isArray(data.readings)) {
      throw new Error('รูปแบบข้อมูลไม่ถูกต้อง');
    }
    buildReport(data.readings);
  } catch (err) {
    setStatus('โหลดข้อมูลไม่สำเร็จ: ' + (err && err.message ? err.message : err), true);
  }
}

function buildReport(readings) {
  const valid = readings.filter(r => r.building || r.meterName);
  if (valid.length === 0) {
    setStatus('ไม่มีข้อมูลในชีต', true);
    renderRows([]);
    return;
  }

  // หารอบจดล่าสุด (เดือนที่มากที่สุดจากวันที่จดจริง) แล้วใช้เฉพาะรอบนั้น
  const months = valid.map(r => (r.date || '').slice(0, 7)).filter(Boolean).sort();
  const latestMonth = months[months.length - 1] || '';
  const cycleReadings = latestMonth
    ? valid.filter(r => (r.date || '').slice(0, 7) === latestMonth)
    : valid;

  // อัปเดตหัวเรื่องเล็กด้านบนตามเดือนจริงจากข้อมูล
  if (latestMonth) {
    const parts = latestMonth.split('-');
    const y = parseInt(parts[0], 10);
    const mo = parseInt(parts[1], 10);
    const label = (THAI_MONTHS[mo] || '') + ' ' + (y + 543);
    document.getElementById('eyebrow').textContent = 'มิเตอร์น้ำ-ไฟ · รอบจด' + label;
  } else {
    document.getElementById('eyebrow').textContent = 'มิเตอร์น้ำ-ไฟ';
  }

  // Pivot: 1 แถวต่อ (ตึก + ห้อง)
  const map = new Map();
  cycleReadings.forEach(r => {
    const key = (r.building || '') + '||' + (r.meterName || '');
    if (!map.has(key)) {
      map.set(key, {
        building: r.building || '',
        room: r.meterName || '',
        waterPrev: null,
        waterCurr: null,
        waterUnits: 0,
        waterCost: 0,
        elecPrev: null,
        elecCurr: null,
        elecUnits: 0,
        elecCost: 0,
      });
    }
    const row = map.get(key);
    const units = Number(r.consumed) || 0;
    const cost = Number(r.cost) || 0;
    if (r.type === 'water') {
      row.waterUnits += units;
      row.waterCost += cost;
      row.waterPrev = r.prevValue;
      row.waterCurr = r.value;
    } else {
      row.elecUnits += units;
      row.elecCost += cost;
      row.elecPrev = r.prevValue;
      row.elecCurr = r.value;
    }
  });

  fullRows = Array.from(map.values()).map(row => ({
    ...row,
    total: row.waterCost + row.elecCost,
  }));
  maxTotal = fullRows.reduce((m, r) => Math.max(m, r.total), 0);

  renderBuildingFilterButtons();
  setStatus('ข้อมูล ' + fullRows.length + ' ห้อง');
  applyFiltersAndRender();
}

// สร้างปุ่มกรองตึกจากข้อมูลจริงในชีตเสมอ (ไม่ hardcode ชื่อตึก) กันกรณีมีตึกใหม่
// เพิ่มเข้ามาในอนาคตแล้วปุ่มกรองไม่อัปเดตตาม (เช่นเคย hardcode แค่ 2 ตึกไว้ ตอนมีตึกที่ 3
// เข้ามาจริงในชีตแล้วปุ่มกรองไม่โผล่ ต้องแก้โค้ดเองถึงจะกรองได้)
function renderBuildingFilterButtons() {
  const wrap = document.getElementById('buildingFilter');
  if (!wrap) return;
  const buildings = Array.from(new Set(fullRows.map(r => r.building).filter(Boolean))).sort((a, b) => a.localeCompare(b, 'th'));
  // ถ้าตึกที่เลือกอยู่ไม่มีอยู่ในข้อมูลแล้ว (เช่นข้อมูลเปลี่ยนไปหลัง refresh) กลับไปที่ "ทั้งหมด"
  if (currentBuilding !== 'all' && !buildings.includes(currentBuilding)) {
    currentBuilding = 'all';
  }
  wrap.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.type = 'button';
  allBtn.className = 'filter-btn' + (currentBuilding === 'all' ? ' active' : '');
  allBtn.dataset.building = 'all';
  allBtn.textContent = 'ทั้งหมด';
  wrap.appendChild(allBtn);
  buildings.forEach(b => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'filter-btn' + (currentBuilding === b ? ' active' : '');
    btn.dataset.building = b;
    btn.textContent = b;
    wrap.appendChild(btn);
  });
  attachBuildingFilterHandlers();
}

function attachBuildingFilterHandlers() {
  document.querySelectorAll('.filter-btn[data-building]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn[data-building]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentBuilding = btn.dataset.building;
      applyFiltersAndRender();
    });
  });
}

function applyFiltersAndRender() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  let rows = fullRows.slice();

  if (currentBuilding !== 'all') {
    rows = rows.filter(r => r.building === currentBuilding);
  }
  if (query) {
    rows = rows.filter(r => r.room.toLowerCase().includes(query));
  }

  rows.sort((a, b) => {
    let cmp;
    const col = sortKey;
    if (col === 'room') {
      cmp = naturalCompare(a.room, b.room);
    } else if (col === 'building') {
      cmp = buildingSortIndex(a.building) - buildingSortIndex(b.building);
      if (cmp === 0) cmp = naturalCompare(a.room, b.room); // ตึกเดียวกัน เรียงเลขห้องต่อเสมอ
    } else {
      cmp = (a[col] || 0) - (b[col] || 0);
    }
    return sortDir === 'asc' ? cmp : -cmp;
  });

  renderRows(rows, query);
}

function fmtMeter(v) {
  return (v === null || v === undefined || v === '') ? '—' : numFmt.format(Number(v));
}

function renderRows(rows, hadQuery) {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  if (rows.length === 0) {
    const tr = document.createElement('tr');
    tr.className = 'empty-row';
    const td = document.createElement('td');
    td.colSpan = 11;
    td.textContent = 'ไม่พบห้องที่ตรงกับคำค้น';
    tr.appendChild(td);
    tbody.appendChild(tr);
    return;
  }

  rows.forEach(r => {
    const tr = document.createElement('tr');

    const tdBuilding = document.createElement('td');
    tdBuilding.textContent = r.building;
    tr.appendChild(tdBuilding);

    const tdRoom = document.createElement('td');
    tdRoom.textContent = r.room;
    tr.appendChild(tdRoom);

    const tdWaterPrev = document.createElement('td');
    tdWaterPrev.className = 'num';
    tdWaterPrev.textContent = fmtMeter(r.waterPrev);
    tr.appendChild(tdWaterPrev);

    const tdWaterCurr = document.createElement('td');
    tdWaterCurr.className = 'num';
    tdWaterCurr.textContent = fmtMeter(r.waterCurr);
    tr.appendChild(tdWaterCurr);

    const tdWaterUnits = document.createElement('td');
    tdWaterUnits.className = 'num';
    tdWaterUnits.textContent = numFmt.format(r.waterUnits);
    tr.appendChild(tdWaterUnits);

    const tdWaterCost = document.createElement('td');
    tdWaterCost.className = 'num';
    tdWaterCost.textContent = numFmt.format(r.waterCost);
    tr.appendChild(tdWaterCost);

    const tdElecPrev = document.createElement('td');
    tdElecPrev.className = 'num';
    tdElecPrev.textContent = fmtMeter(r.elecPrev);
    tr.appendChild(tdElecPrev);

    const tdElecCurr = document.createElement('td');
    tdElecCurr.className = 'num';
    tdElecCurr.textContent = fmtMeter(r.elecCurr);
    tr.appendChild(tdElecCurr);

    const tdElecUnits = document.createElement('td');
    tdElecUnits.className = 'num' + (r.elecUnits > ELECTRIC_WARNING_UNITS ? ' warning' : '');
    tdElecUnits.textContent = numFmt.format(r.elecUnits);
    tr.appendChild(tdElecUnits);

    const tdElecCost = document.createElement('td');
    tdElecCost.className = 'num';
    tdElecCost.textContent = numFmt.format(r.elecCost);
    tr.appendChild(tdElecCost);

    const tdTotal = document.createElement('td');
    tdTotal.className = 'num';
    const pct = maxTotal > 0 ? Math.max(2, Math.round((r.total / maxTotal) * 100)) : 0;
    tdTotal.innerHTML =
      '<div class="total-cell">' +
        '<span class="total-bar-track"><span class="total-bar-fill" style="width:' + pct + '%"></span></span>' +
        '<span>' + numFmt.format(r.total) + '</span>' +
      '</div>';
    tr.appendChild(tdTotal);

    tbody.appendChild(tr);
  });
}

function setupSorting() {
  const ths = document.querySelectorAll('#reportTable thead th');
  ths.forEach(th => {
    const activate = () => {
      const key = th.dataset.key;
      if (sortKey === key) {
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        sortKey = key;
        sortDir = key === 'room' || key === 'building' ? 'asc' : 'desc';
      }
      ths.forEach(t => {
        t.removeAttribute('aria-sort');
        t.querySelector('.arrow').textContent = '';
      });
      th.setAttribute('aria-sort', sortDir === 'asc' ? 'ascending' : 'descending');
      th.querySelector('.arrow').textContent = sortDir === 'asc' ? '▲' : '▼';
      applyFiltersAndRender();
    };
    th.addEventListener('click', activate);
    th.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        activate();
      }
    });
  });
}

function setupFilters() {
  document.getElementById('searchInput').addEventListener('input', applyFiltersAndRender);
  const refreshBtn = document.getElementById('refreshBtn');
  if (refreshBtn) {
    refreshBtn.addEventListener('click', () => loadData());
  }
}

// คืนรายการแถวที่กำลังแสดงอยู่บนจอตอนนี้จริง ๆ (กรอง+เรียงแล้ว) เพื่อให้
// ทุกช่องทางส่งออก (Excel/Word/PDF) ตรงกับสิ่งที่เห็นบนตารางเสมอ ไม่ใช่ข้อมูลดิบทั้งหมด
function getVisibleRows() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  let rows = fullRows.slice();
  if (currentBuilding !== 'all') {
    rows = rows.filter(r => r.building === currentBuilding);
  }
  if (query) {
    rows = rows.filter(r => r.room.toLowerCase().includes(query));
  }
  rows.sort((a, b) => {
    let cmp;
    const col = sortKey;
    if (col === 'room') {
      cmp = naturalCompare(a.room, b.room);
    } else if (col === 'building') {
      cmp = buildingSortIndex(a.building) - buildingSortIndex(b.building);
      if (cmp === 0) cmp = naturalCompare(a.room, b.room);
    } else {
      cmp = (a[col] || 0) - (b[col] || 0);
    }
    return sortDir === 'asc' ? cmp : -cmp;
  });
  return rows;
}

const EXPORT_HEADERS = ['ตึก', 'ห้อง', 'น้ำครั้งก่อน', 'น้ำครั้งนี้', 'น้ำ (หน่วย)', 'ค่าน้ำ (บาท)', 'ไฟครั้งก่อน', 'ไฟครั้งนี้', 'ไฟ (หน่วย)', 'ค่าไฟ (บาท)', 'รวม (บาท)'];

function rowToCells(r) {
  return [
    r.building,
    r.room,
    fmtMeter(r.waterPrev),
    fmtMeter(r.waterCurr),
    numFmt.format(r.waterUnits),
    numFmt.format(r.waterCost),
    fmtMeter(r.elecPrev),
    fmtMeter(r.elecCurr),
    numFmt.format(r.elecUnits),
    numFmt.format(r.elecCost),
    numFmt.format(r.total),
  ];
}

function buildExportHtmlTable(rows) {
  const theadCells = EXPORT_HEADERS.map((h, i) => '<th' + (i >= 2 ? ' class="num"' : '') + '>' + h + '</th>').join('');
  const bodyRows = rows.map(r => {
    const cells = rowToCells(r).map((v, i) => '<td' + (i >= 2 ? ' class="num"' : '') + '>' + v + '</td>').join('');
    return '<tr>' + cells + '</tr>';
  }).join('');
  return '<table><thead><tr>' + theadCells + '</tr></thead><tbody>' + bodyRows + '</tbody></table>';
}

function reportTitle() {
  return document.getElementById('eyebrow').textContent + ' · ' + document.getElementById('h1Text').textContent;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// Excel: SpreadsheetML XML เปิดด้วย Excel ได้ตรง ๆ ไม่ใช่แค่ CSV ดิบ (รองรับ .xlsx จริง)
function exportExcel() {
  const rows = getVisibleRows();
  if (rows.length === 0) { alert('ไม่มีข้อมูลให้ส่งออก'); return; }
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const headerCells = EXPORT_HEADERS.map(h => '<Cell><Data ss:Type="String">' + esc(h) + '</Data></Cell>').join('');
  const numCell = v => (v === null || v === undefined || v === '')
    ? '<Cell><Data ss:Type="String"></Data></Cell>'
    : '<Cell><Data ss:Type="Number">' + Number(v) + '</Data></Cell>';
  const bodyRows = rows.map(r => {
    const cells = [
      '<Cell><Data ss:Type="String">' + esc(r.building) + '</Data></Cell>',
      '<Cell><Data ss:Type="String">' + esc(r.room) + '</Data></Cell>',
      numCell(r.waterPrev),
      numCell(r.waterCurr),
      '<Cell><Data ss:Type="Number">' + r.waterUnits + '</Data></Cell>',
      '<Cell><Data ss:Type="Number">' + r.waterCost + '</Data></Cell>',
      numCell(r.elecPrev),
      numCell(r.elecCurr),
      '<Cell><Data ss:Type="Number">' + r.elecUnits + '</Data></Cell>',
      '<Cell><Data ss:Type="Number">' + r.elecCost + '</Data></Cell>',
      '<Cell><Data ss:Type="Number">' + r.total + '</Data></Cell>',
    ].join('');
    return '<Row>' + cells + '</Row>';
  }).join('');
  const xml = '<?xml version="1.0"?>' +
    '<?mso-application progid="Excel.Sheet"?>' +
    '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">' +
    '<Worksheet ss:Name="รายละเอียดรายห้อง"><Table>' +
    '<Row>' + headerCells + '</Row>' +
    bodyRows +
    '</Table></Worksheet></Workbook>';
  const blob = new Blob([xml], { type: 'application/vnd.ms-excel' });
  downloadBlob(blob, 'รายละเอียดรายห้อง.xls');
}

// Word: HTML ที่ Word เปิดเป็นเอกสารได้ตรง ๆ (นามสกุล .doc)
function exportWord() {
  const rows = getVisibleRows();
  if (rows.length === 0) { alert('ไม่มีข้อมูลให้ส่งออก'); return; }
  const table = buildExportHtmlTable(rows);
  const html = '<html><head><meta charset="UTF-8"><style>' +
    'body{font-family:"TH Sarabun New","Leelawadee UI",sans-serif;}' +
    'table{border-collapse:collapse;width:100%;}' +
    'th,td{border:1px solid #999;padding:6px 10px;}' +
    'th{background:#eee;}' +
    'td.num,th.num{text-align:right;}' +
    '</style></head><body>' +
    '<h3>' + reportTitle() + '</h3>' +
    table +
    '</body></html>';
  const blob = new Blob(['\ufeff' + html], { type: 'application/msword' });
  downloadBlob(blob, 'รายละเอียดรายห้อง.doc');
}

function openPreview() {
  const rows = getVisibleRows();
  const content = document.getElementById('previewContent');
  if (rows.length === 0) {
    content.innerHTML = '<p>ไม่มีข้อมูลให้แสดง</p>';
  } else {
    content.innerHTML = '<h3>' + reportTitle() + '</h3>' + buildExportHtmlTable(rows);
  }
  document.getElementById('previewOverlay').classList.add('open');
}

function closePreview() {
  document.getElementById('previewOverlay').classList.remove('open');
}

function setupMenu() {
  const menuBtn = document.getElementById('menuBtn');
  const dropdown = document.getElementById('menuDropdown');

  function closeMenu() {
    dropdown.classList.remove('open');
    menuBtn.setAttribute('aria-expanded', 'false');
  }
  function toggleMenu() {
    const open = dropdown.classList.toggle('open');
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleMenu();
  });
  document.addEventListener('click', (e) => {
    if (!dropdown.contains(e.target) && e.target !== menuBtn) closeMenu();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeMenu(); closePreview(); }
  });

  dropdown.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      closeMenu();
      const action = btn.dataset.action;
      if (action === 'excel') exportExcel();
      else if (action === 'word') exportWord();
      else if (action === 'preview-print') openPreview();
    });
  });

  document.getElementById('previewCloseBtn').addEventListener('click', closePreview);
  document.getElementById('previewOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'previewOverlay') closePreview();
  });
  document.getElementById('previewPrintBtn').addEventListener('click', () => {
    window.print();
  });
}

setupSorting();
setupFilters();
setupMenu();
loadData();
</script>
